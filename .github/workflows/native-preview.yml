name: Isolated native preview executable

on:
  push:
    branches: [feature/isolated-native-preview-2026-10-15]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      # This source-only preview uses ffmpeg/ffprobe from PATH. Production bundle
      # sidecars and Whisper assets are not present in the public source tree.
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":null}}'
    steps:
      - uses: actions/checkout@v4
      - name: Check renderer interactions and syntax
        shell: pwsh
        run: |
          node --check renderer/app.js
          node --check renderer/library-state.js
          node --test tests/library-state.test.js
      - name: Select stable Rust
        shell: pwsh
        run: rustup default stable
      - name: Test isolated preview source selection
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml preview_scans_only_its_synthetic_clips_folder
      - name: Build native Tauri app
        shell: pwsh
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Bound and hash executable
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/debug/replaystrike.exe
          if ($exe.Length -gt 80MB) { throw "Debug executable exceeds 80 MiB cap: $($exe.Length)" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$sha  replaystrike.exe" | Set-Content artifact/SHA256.txt -Encoding ascii
          Write-Output "Executable bytes: $($exe.Length); SHA-256: $sha"
      - name: Attempt native app-window capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $signature = @'
          using System;
          using System.Runtime.InteropServices;
          public static class CaptureWindow {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr handle, out Rect rect);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr handle, int command);
          }
          '@
          Add-Type -TypeDefinition $signature
          $app = (Resolve-Path 'src-tauri/target/debug/replaystrike.exe').Path
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden
          try {
            $handle = [IntPtr]::Zero
            for ($try = 0; $try -lt 30; $try++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              $handle = $process.MainWindowHandle
              if ($handle -ne [IntPtr]::Zero) { break }
            }
            if ($handle -eq [IntPtr]::Zero) { throw 'No native app window became available' }
            [CaptureWindow]::ShowWindow($handle, 5) | Out-Null
            Start-Sleep -Seconds 2
            $rect = New-Object CaptureWindow+Rect
            if (-not [CaptureWindow]::GetWindowRect($handle, [ref]$rect)) { throw 'Cannot read app window bounds' }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -lt 600 -or $height -lt 400 -or $width -gt 3000 -or $height -gt 2000) { throw "Unexpected window size: ${width}x${height}" }
            $bitmap = New-Object System.Drawing.Bitmap($width, $height)
            try {
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try { $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size) } finally { $graphics.Dispose() }
              $bitmap.Save('artifact/replaystrike-native-window.png', [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bitmap.Dispose() }
            "App-window crop from exact commit $env:GITHUB_SHA; hosted Windows runner." | Set-Content artifact/native-capture.txt
          } catch {
            "Native app-window capture unavailable: $_" | Set-Content artifact/native-capture.txt
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: replaystrike-isolated-preview
          path: |
            src-tauri/target/debug/replaystrike.exe
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: replaystrike-native-image
          path: |
            artifact/native-capture.txt
            artifact/replaystrike-native-window.png
          if-no-files-found: error
          retention-days: 1

  capture-evidence:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: replaystrike-native-image
          path: capture
      - name: Verify native window image exists and contains rendered detail
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $path = Join-Path (Get-Location) 'capture/replaystrike-native-window.png'
          if (-not (Test-Path -LiteralPath $path)) {
            Get-Content capture/native-capture.txt
            throw 'Native app screenshot unavailable; build and source tests are recorded in the build job'
          }
          $bitmap = [System.Drawing.Bitmap]::FromFile($path)
          try {
            if ($bitmap.Width -lt 600 -or $bitmap.Height -lt 400) { throw 'Native image dimensions are too small' }
            $colors = [System.Collections.Generic.HashSet[int]]::new()
            for ($x = 40; $x -lt $bitmap.Width; $x += 47) {
              for ($y = 40; $y -lt $bitmap.Height; $y += 47) {
                [void]$colors.Add($bitmap.GetPixel($x, $y).ToArgb())
              }
            }
            if ($colors.Count -lt 8) { throw "Native image lacks rendered detail: $($colors.Count) colors" }
            "Image $($bitmap.Width)x$($bitmap.Height), sampled colors $($colors.Count), commit $env:GITHUB_SHA"
          } finally { $bitmap.Dispose() }
